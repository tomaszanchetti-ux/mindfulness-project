<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Molde de carta — set en construcción</title>
<!--
  MOLDE DE CARTA (plantilla reutilizable).
  Para sumar una categoría: agregá un objeto al array CARTAS de abajo con su
  color de acento (la franja), el PNG del dibujo, el nombre de la acción y una
  frase + micro-prompt de ejemplo. Renderiza frente y dorso automáticamente.
-->
<style>
  body{margin:0;background:#d9cfba;font-family:-apple-system,"Segoe UI",sans-serif;padding:48px 20px}
  h1{text-align:center;color:#5f5647;font-weight:500;letter-spacing:.04em;margin:0 0 36px}
  .row{display:flex;gap:30px;justify-content:center;align-items:flex-start;flex-wrap:wrap;margin-bottom:46px}
  .col{display:flex;flex-direction:column;align-items:center;gap:12px}
  .card{width:300px;height:440px;background:#EFE6D3;border-radius:26px;overflow:hidden;
        box-shadow:0 24px 60px rgba(80,60,30,.28);display:flex;flex-direction:column;align-items:center}
  .band{height:16px;width:100%}
  .cat{margin-top:40px;letter-spacing:.52em;text-transform:lowercase;font-size:15px}
  .draw{flex:1;display:flex;align-items:center;justify-content:center;width:100%}
  .draw img{width:205px}
  .act{letter-spacing:.42em;text-transform:lowercase;color:#9a927e;font-size:12px;margin-bottom:40px}
  .frase{font-family:Georgia,serif;font-style:italic;font-size:17px;line-height:1.5;color:#46423b;
         text-align:center;padding:0 32px;margin-top:42px}
  .gly{flex:1;display:flex;align-items:center;justify-content:center;font-size:30px;opacity:.55}
  .prompt{font-size:13.5px;line-height:1.55;color:#5f5a50;text-align:center;padding:0 30px;margin-bottom:34px}
  .lab{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#6b6147}
  .cattag{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#6b6147;text-align:center;margin:0 0 14px}
</style>
</head>
<body>
<h1>Molde de carta · set en construcción</h1>
<div id="set"></div>

<script>
const CARTAS = [
  { cat:'gratitud', accent:'#E2A93B', text:'#8a6a2e',
    img:'assets/categorias/cat_gratitud.png', action:'contemplar', gly:'◡',
    frase:'A veces lo que más sostiene la vida es eso pequeño que damos por sentado.',
    prompt:'Mirá a tu alrededor y elegí una sola cosa que esté ahí, callada, sosteniéndote. Quedate con ella un momento y anotala.' },
  { cat:'calma', accent:'#becdd7', text:'#757f85',
    img:'assets/categorias/cat_calma.png', action:'respirar', gly:'◠',
    frase:'No todo necesita resolverse hoy. Algunas cosas se acomodan cuando dejás de empujarlas.',
    prompt:'Tomá diez respiraciones lentas. Al terminar, escribí qué podés soltar por unas horas.' },
  { cat:'perspectiva', accent:'#ac7b53', text:'#6a4c33',
    img:'assets/categorias/cat_perspectiva.png', action:'escribir', gly:'✎',
    frase:'Un mal momento no define una vida; es una parte del paisaje.',
    prompt:'Escribí lo que hoy se siente enorme. Al lado, cómo lo verías desde un año adelante.' },
  { cat:'resiliencia', accent:'#9eb55c', text:'#617039',
    img:'assets/categorias/cat_resiliencia.png', action:'caminar', gly:'⌃',
    frase:'También sos las veces que te levantaste.',
    prompt:'Salí a caminar diez minutos; con cada paso, acordate de una vez que pudiste seguir.' },
];

const set = document.getElementById('set');
for (const c of CARTAS){
  const block = document.createElement('div');
  block.innerHTML = `
    <p class="cattag">${c.cat}</p>
    <div class="row">
      <div class="col">
        <div class="card">
          <div class="band" style="background:${c.accent}"></div>
          <div class="cat" style="color:${c.text}">${c.cat}</div>
          <div class="draw"><img src="${c.img}" alt="${c.cat}"></div>
          <div class="act">${c.action}</div>
        </div>
        <div class="lab">Frente</div>
      </div>
      <div class="col">
        <div class="card">
          <div class="band" style="background:${c.accent}"></div>
          <div class="frase">"${c.frase}"</div>
          <div class="gly" style="color:${c.text}">${c.gly}</div>
          <div class="prompt">${c.prompt}</div>
        </div>
        <div class="lab">Dorso</div>
      </div>
    </div>`;
  set.appendChild(block);
}
</script>
</body>
</html>
