# PÍLDORA · "MIL SELFIES" — el pilar Amor propio, el opuesto: el juez interno, gustarse por
# aprobación. UNA situación (el espejo del baño) con un beat adentro.
#
# La coreografía: Teo se saca cuarenta fotos cambiando de pose, con el fogonazo del flash ·
# mira el resultado y se le cae la cara · Pipo se mira en el MISMO espejo, se ve horrible
# (el reflejo deformado) y le encanta.
#
# La gramática (`estado:`): la sesión de fotos DESCONECTA (sin aura, Pipo enojado). Pipo
# mirándose está en el presente: contento. La boca de Teo va libre en la sesión — ahí la cara
# es el chiste (el pico de pato), no el estado.
#
#   python3 Flipbook/motor/libro.py Flipbook/guiones/p01_selfies.yaml

volumen: 3
titulo: MIL SELFIES
nombre: p01_selfies

cartel: {tinta: ocre, formas: diagonales, vineta: tintin}
globos: abajo
subir_escena: 220

cierre:
  pipo: 2.6
  dice: no hacen falta cuarenta fotos. hace falta un rato de presente.

escenas:
  - tipo: problema
    fondo: espejo_bano
    cuadros:

      # --------------------------------------- 1 · la sesión (DESCONEXIÓN) · 2,8 s
      - hojas: 28
        estado: desconexion
        camara: {hasta: 1.08}
        flash: {desde: 5, cada: 6, dura: 1, fuerza: 0.85}
        teo:
          cuerpo: [selfie, selfie_flex]
          cara: [frente_pico, arriba_sonrisa, costado_pico, frente_abierta]
          boca_libre: true          # acá la cara es el chiste, no el estado
          ritmo: 5
          x: 390
          y: 1150
          escala: 1.5
          vida: 1.4
          prop: {nombre: telefono_4, ancla: mano, escala: 1.2, rot: 16,
                 brillo: 0.5, brillo_color: blanco}
        pipo_asoma: {lado: izquierda}
        pipo_dice:
          - {texto: "cuarenta fotos buscando la cara correcta.", desde: 3, hasta: 24}

      # ------------------------------ 2 · mira el resultado (DESCONEXIÓN) · 1,8 s
      - hojas: 18
        estado: desconexion
        camara: empuje_fuerte
        teo:
          cuerpo: encorvado
          cara: abajo_plana
          x: 430
          y: 1150
          escala: 1.45
          vida: 0.7
          prop: {nombre: telefono_4, ancla: mano_der, escala: 1.15, dx: -10, dy: -30, rot: -18,
                 brillo: 0.6, brillo_color: blanco}
        pipo_asoma: {lado: izquierda}
        pipo_dice:
          - {texto: "ninguna se parecía a él.", desde: 2, hasta: 18}

      # ------------------------------------- 3 · Pipo en el mismo espejo · 3,2 s
      # Pipo pega la cara CONTRA el vidrio: una sola cabeza, aplastada, llenando el óvalo.
      # Con Pipo abajo y su reflejo arriba parecían dos Pipos apilados, no un espejo.
      - hojas: 32
        camara: {hasta: 1.10}
        piezas:
          - {pieza: pipo/cara_orgullo, en: espejo, dy: 105, escala: 1.1,
             aplasta: {x: 1.6, y: 0.64}, hacia_escala: 1.18}
        globo_ancla: {x: 540, y: 1010, alto: 120}     # el globo sale del espejo
        pipo_dice:
          - {texto: "yo me miro una vez. y me encanta.", desde: 4, hasta: 32}
