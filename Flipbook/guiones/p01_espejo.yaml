# PÍLDORA · "EL DILEMA DEL ESPEJO" — el pilar Amor propio. UNA SOLA ESCENA, bien hecha.
#
# La puesta en escena (Tomás, WS36): Teo DE ESPALDAS en primer plano, con el teléfono en alto
# apuntando al espejo · el espejo de frente, grande · y adentro del espejo SU CARA, de frente.
# Hay dos Teos: el de espaldas y el reflejo. Lo único que cambia en toda la píldora es la
# cara del reflejo, que MUTA: normal → boquita → la caricatura de la pose de revista.
#
# Pipo aparece DOS veces y nada más: una para señalar el problema, otra para nombrar el
# presente. El cierre es su cara y el círculo, sin decir nada.
#
#   python3 Flipbook/motor/libro.py Flipbook/guiones/p01_espejo.yaml

volumen: 3
titulo: EL DILEMA DEL ESPEJO
nombre: p01_espejo

cartel: {tinta: ocre, formas: diagonales, vineta: tintin}
globos: abajo
subir_escena: 220

cierre:
  pipo: 0.7                       # la cara de Pipo y el círculo, sin decir nada

escenas:
  - tipo: problema
    fondo: espejo_bano
    estado: desconexion
    cuadros:

      # --------------------------------------------- 1 · la cara normal · 2,2 s
      - hojas: 22
        camara: {desde: 1.0, hasta: 1.07}
        teo: {cuerpo: espaldas, cara: nuca, x: 540, y: 1850, escala: 2.0, vida: 0.8,
              prop: {nombre: telefono_0, ancla: mano, escala: 0.92, rot: -34}}
        piezas:
          - {pieza: teo/cara_frente_plana, en: espejo, dx: -35, escala: 1.55}
        pipo_asoma: {lado: izquierda}
        pipo_dice:
          - {texto: "todo el día la misma historia con el espejito.", desde: 2, hasta: 22, cara: fastidio}

      # ------------------------------------------------ 2 · la boquita · 2,0 s
      - hojas: 20
        camara: {desde: 1.07, hasta: 1.14}
        teo: {cuerpo: espaldas, cara: nuca, x: 540, y: 1850, escala: 2.0, vida: 1.0,
              prop: {nombre: telefono_0, ancla: mano, escala: 0.92, rot: -34}}
        piezas:
          - {pieza: teo/cara_frente_pico, en: espejo, dx: -35, escala: 1.6}

      # ------------------------------- 3 · la caricatura de la pose · 2,8 s
      - hojas: 28
        camara: {desde: 1.14, hasta: 1.24}
        teo: {cuerpo: espaldas, cara: nuca, x: 540, y: 1850, escala: 2.0, vida: 1.2,
              prop: {nombre: telefono_0, ancla: mano, escala: 0.92, rot: -34}}
        piezas:
          # los dos aprietes alternan: la cara "trabaja" sola delante del espejo
          - {pieza: teo/cara_pose_0, alterna: [teo/cara_pose_0, teo/cara_pose_1], ritmo: 4,
             en: espejo, dx: -35, escala: 1.66}
        pipo_asoma: {lado: izquierda}
        pipo_dice:
          - {texto: "vuelve al presente, Teito.", desde: 6, hasta: 28, cara: en_serio}
