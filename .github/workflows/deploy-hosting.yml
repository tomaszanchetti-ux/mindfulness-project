# Auto-deploy del front a Firebase Hosting (clásico) en cada push a main.
# El backend (Cloud Run) NO se despliega acá: sigue siendo manual (ver WS09/WS13).
name: Deploy Hosting

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "firebase.json"
      - ".github/workflows/deploy-hosting.yml"

# GitHub deja de soportar Node 20 en los runners (forzado a 24 el 16/06/2026).
# checkout/setup-node v5 ya corren en Node 24; la action de Firebase sigue en @v0
# (tag flotante), así que forzamos Node 24 ahora para detectar roturas con tiempo.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build
        working-directory: apps/web
        run: |
          npm ci
          npm run build

      - name: Deploy a Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DWELLIA_APP }}
          projectId: dwellia-app
          channelId: live
